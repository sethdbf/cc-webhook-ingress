services:
  - type: web
    name: cc-webhook-ingress
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cc-webhook-ingress-db
          property: connectionString

      - key: ROUTES_JSON
        value: >-
          [
            {
              "name": "payment_released",
              "match_prefix": ["payment_released_notification"],
              "url": "https://hooks.zapier.com/hooks/catch/7486139/u0ufvl5/"
            },
            {
              "name": "payment_failed",
              "match_prefix": ["payment_failed_notification"],
              "url": "https://hooks.zapier.com/hooks/catch/7486139/u0uldxy/"
            },
            {
              "name": "trade_settled",
              "match_prefix": ["trade_settled_notification"],
              "url": "https://hooks.zapier.com/hooks/catch/7486139/u0uliev/"
            }
          ]

      - key: ZAPIER_FALLBACK_URL
        value: ""

      - key: VERIFY_SIGNATURE
        value: "false"

      - key: CC_WEBHOOK_SECRET
        value: ""

      - key: SERVICE_NAME
        value: cc-webhook-ingress

databases:
  - name: cc-webhook-ingress-db
    plan: basic-256mb
